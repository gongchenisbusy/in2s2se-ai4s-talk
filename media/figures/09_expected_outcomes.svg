<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="研究的材料、功能和方法结果">
  <title>研究的材料、功能和方法结果</title>
  <desc>材料、功能、方法三类研究结果汇入可达性决策框架。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#718B99" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;letter-spacing:.2px}</style>
  <rect width="1200" height="650" fill="#FAFAF7"/>
  <rect x="63" y="130" width="310" height="274" rx="18" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <rect x="88" y="154" width="132" height="36" rx="18" fill="#E9F0EA" stroke="#E9F0EA" stroke-width="0"/>
  <text x="154.0" y="179" fill="#93A999" font-size="17" font-weight="600" text-anchor="middle">材料结果</text>
  <text x="90" y="269" fill="#33434A" font-size="29" font-weight="650" text-anchor="start">目标层序</text>
  <text x="90" y="315" fill="#6F7B7C" font-size="22" font-weight="400" text-anchor="start">或明确受阻机制</text>
  <line x1="218" y1="411" x2="218" y2="457" stroke="#93A999" stroke-width="2" stroke-linecap="round"/>
  <rect x="445" y="130" width="310" height="274" rx="18" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <rect x="470" y="154" width="132" height="36" rx="18" fill="#F4EBE6" stroke="#F4EBE6" stroke-width="0"/>
  <text x="536.0" y="179" fill="#B98B7B" font-size="17" font-weight="600" text-anchor="middle">功能结果</text>
  <text x="472" y="269" fill="#33434A" font-size="29" font-weight="650" text-anchor="start">滑移铁电</text>
  <text x="472" y="315" fill="#6F7B7C" font-size="22" font-weight="400" text-anchor="start">与光伏耦合验证</text>
  <line x1="600" y1="411" x2="600" y2="457" stroke="#B98B7B" stroke-width="2" stroke-linecap="round"/>
  <rect x="827" y="130" width="310" height="274" rx="18" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <rect x="852" y="154" width="132" height="36" rx="18" fill="#E7EEF0" stroke="#E7EEF0" stroke-width="0"/>
  <text x="918.0" y="179" fill="#718B99" font-size="17" font-weight="600" text-anchor="middle">方法结果</text>
  <text x="854" y="269" fill="#33434A" font-size="29" font-weight="650" text-anchor="start">AI 辅助</text>
  <text x="854" y="315" fill="#6F7B7C" font-size="22" font-weight="400" text-anchor="start">可达性决策流程</text>
  <line x1="982" y1="411" x2="982" y2="457" stroke="#718B99" stroke-width="2" stroke-linecap="round"/>
  <line x1="218" y1="457" x2="982" y2="457" stroke="#C9D0CC" stroke-width="2" stroke-linecap="round"/>
  <line x1="600" y1="457" x2="600" y2="493" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="295" y="508" width="610" height="74" rx="17" fill="#EEF1ED" stroke="#EEF1ED" stroke-width="0"/>
  <text x="600" y="557" fill="#33434A" font-size="27" font-weight="600" text-anchor="middle">预测稳定  →  实验可达  →  功能可信</text>
  <line x1="52" y1="606" x2="1148" y2="606" stroke="#C9D0CC" stroke-width="1" stroke-linecap="round"/>
  <text x="54" y="630" fill="#6F7B7C" font-size="15" font-weight="400" text-anchor="start">研究预期回答的问题；各项结果以实际证据为准</text>
</svg>
