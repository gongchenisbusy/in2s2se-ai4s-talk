<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="AI 辅助合成与表征的闭环决策">
  <title>AI 辅助合成与表征的闭环决策</title>
  <desc>主动学习根据成功、失败和未知数据选择下一次合成或追加表征。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#718B99" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;letter-spacing:.2px}</style>
  <rect width="1200" height="650" fill="#FAFAF7"/>
  <rect x="48" y="111" width="230" height="138" rx="16" fill="#E7EEF0" stroke="#718B99" stroke-width="1.5"/>
  <text x="163.0" y="173" fill="#33434A" font-size="28" font-weight="650" text-anchor="middle">候选条件</text>
  <text x="163.0" y="210" fill="#6F7B7C" font-size="17" font-weight="400" text-anchor="middle">温度 · 供料 · 时序</text>
  <rect x="330" y="111" width="230" height="138" rx="16" fill="#FFFFFF" stroke="#718B99" stroke-width="1.5"/>
  <text x="445.0" y="173" fill="#33434A" font-size="28" font-weight="650" text-anchor="middle">独立合成</text>
  <text x="445.0" y="210" fill="#6F7B7C" font-size="17" font-weight="400" text-anchor="middle">记录炉次与样片</text>
  <rect x="612" y="111" width="230" height="138" rx="16" fill="#FFFFFF" stroke="#718B99" stroke-width="1.5"/>
  <text x="727.0" y="173" fill="#33434A" font-size="28" font-weight="650" text-anchor="middle">快速筛选</text>
  <text x="727.0" y="210" fill="#6F7B7C" font-size="17" font-weight="400" text-anchor="middle">AFM · Raman / PL</text>
  <rect x="894" y="111" width="258" height="138" rx="16" fill="#E9F0EA" stroke="#93A999" stroke-width="1.5"/>
  <text x="1023.0" y="173" fill="#33434A" font-size="28" font-weight="650" text-anchor="middle">结构判别</text>
  <text x="1023.0" y="210" fill="#6F7B7C" font-size="17" font-weight="400" text-anchor="middle">候选＋易误判反例</text>
  <line x1="282" y1="180" x2="322" y2="180" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="564" y1="180" x2="604" y2="180" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="846" y1="180" x2="886" y2="180" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="260" y="342" width="300" height="126" rx="16" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <text x="410" y="391" fill="#33434A" font-size="26" font-weight="650" text-anchor="middle">数据与标签</text>
  <text x="410" y="431" fill="#6F7B7C" font-size="18" font-weight="400" text-anchor="middle">目标 / 失败 / 证据不足</text>
  <rect x="643" y="342" width="300" height="126" rx="16" fill="#E7EEF0" stroke="#718B99" stroke-width="1.5"/>
  <text x="793" y="391" fill="#33434A" font-size="26" font-weight="650" text-anchor="middle">主动学习模型</text>
  <text x="793" y="431" fill="#6F7B7C" font-size="18" font-weight="400" text-anchor="middle">收益 × 不确定性 × 成本</text>
  <path d="M1024 256 V300 Q1024 322 1002 322 H410 V334" stroke="#718B99" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="560" y1="405" x2="635" y2="405" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="793" y1="473" x2="793" y2="513" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="538" y="516" width="510" height="77" rx="14" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <text x="793" y="563" fill="#33434A" font-size="21" font-weight="550" text-anchor="middle">下一炉合成    或    给现有样品补做关键表征</text>
  <path d="M533 554 H127 Q103 554 103 530 V259" stroke="#718B99" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="103" y1="280" x2="103" y2="259" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="52" y1="606" x2="1148" y2="606" stroke="#C9D0CC" stroke-width="1" stroke-linecap="round"/>
  <text x="54" y="630" fill="#6F7B7C" font-size="15" font-weight="400" text-anchor="start">目标是减少达到独立结构确证所需的炉次与表征成本</text>
</svg>
