<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="理论预测到实验样品之间的三道门槛">
  <title>理论预测到实验样品之间的三道门槛</title>
  <desc>反应路径、结构身份、跨批复现连接计算预测和可信实验样品。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#718B99" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;letter-spacing:.2px}</style>
  <rect width="1200" height="650" fill="#FAFAF7"/>
  <rect x="44" y="223" width="176" height="184" rx="16" fill="#E7EEF0" stroke="#718B99" stroke-width="1.5"/>
  <text x="132" y="293" fill="#718B99" font-size="38" font-weight="700" text-anchor="middle">DFT</text>
  <text x="132" y="336" fill="#33434A" font-size="24" font-weight="500" text-anchor="middle">候选结构</text>
  <line x1="225" y1="315" x2="283" y2="315" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="290" y="177" width="194" height="276" rx="16" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <rect x="312" y="201" width="63" height="36" rx="18" fill="#F4EBE6" stroke="#F4EBE6" stroke-width="0"/>
  <text x="343.5" y="226" fill="#B98B7B" font-size="17" font-weight="600" text-anchor="middle">01</text>
  <text x="387" y="298" fill="#33434A" font-size="28" font-weight="650" text-anchor="middle">反应路径</text>
  <line x1="332" y1="329" x2="442" y2="329" stroke="#B98B7B" stroke-width="2" stroke-linecap="round"/>
  <text x="387" y="370" fill="#6F7B7C" font-size="18" font-weight="400" text-anchor="middle">交换 vs 混排/损伤</text>
  <line x1="488" y1="315" x2="504" y2="315" stroke="#718B99" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="510" y="177" width="194" height="276" rx="16" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <rect x="532" y="201" width="63" height="36" rx="18" fill="#E9F0EA" stroke="#E9F0EA" stroke-width="0"/>
  <text x="563.5" y="226" fill="#93A999" font-size="17" font-weight="600" text-anchor="middle">02</text>
  <text x="607" y="298" fill="#33434A" font-size="28" font-weight="650" text-anchor="middle">结构身份</text>
  <line x1="552" y1="329" x2="662" y2="329" stroke="#93A999" stroke-width="2" stroke-linecap="round"/>
  <text x="607" y="370" fill="#6F7B7C" font-size="18" font-weight="400" text-anchor="middle">具体 S/Se 原子层</text>
  <line x1="708" y1="315" x2="724" y2="315" stroke="#718B99" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="730" y="177" width="194" height="276" rx="16" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="1.5"/>
  <rect x="752" y="201" width="63" height="36" rx="18" fill="#E7EEF0" stroke="#E7EEF0" stroke-width="0"/>
  <text x="783.5" y="226" fill="#718B99" font-size="17" font-weight="600" text-anchor="middle">03</text>
  <text x="827" y="298" fill="#33434A" font-size="28" font-weight="650" text-anchor="middle">跨批复现</text>
  <line x1="772" y1="329" x2="882" y2="329" stroke="#718B99" stroke-width="2" stroke-linecap="round"/>
  <text x="827" y="370" fill="#6F7B7C" font-size="18" font-weight="400" text-anchor="middle">结构与功能保持</text>
  <line x1="926" y1="315" x2="978" y2="315" stroke="#718B99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="985" y="223" width="170" height="184" rx="16" fill="#E9F0EA" stroke="#93A999" stroke-width="1.5"/>
  <text x="1070" y="295" fill="#33434A" font-size="34" font-weight="700" text-anchor="middle">可信</text>
  <text x="1070" y="336" fill="#33434A" font-size="23" font-weight="500" text-anchor="middle">实验样品</text>
  <line x1="52" y1="606" x2="1148" y2="606" stroke="#C9D0CC" stroke-width="1" stroke-linecap="round"/>
  <text x="54" y="630" fill="#6F7B7C" font-size="15" font-weight="400" text-anchor="start">层序与流程示意｜非实验数据</text>
</svg>
